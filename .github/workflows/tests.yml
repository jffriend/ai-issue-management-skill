name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "CLAUDE.md"
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "CLAUDE.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover tests
